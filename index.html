<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NextGen TV OS</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --bg: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --accent: #00ff9d;
        }

        body { 
            background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 40px; overflow-x: hidden;
        }

        /* DISTRIBUCIÓN SUPERIOR: REPRODUCTOR + PANEL INFO */
        .top-section {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
            margin-bottom: 50px;
        }

        #contenedor-reproductor {
            width: 100%; aspect-ratio: 16/9; border-radius: 20px;
            overflow: hidden; border: 2px solid #222;
        }

        .panel-info {
            background: var(--glass); backdrop-filter: blur(20px);
            border-radius: 20px; padding: 30px; border: 1px solid rgba(255,255,255,0.1);
        }

        /* CARRUSEL DE CANALES */
        .fila-seccion { margin-bottom: 40px; }
        .titulo-seccion { font-size: 20px; margin-bottom: 20px; opacity: 0.8; }
        
        .carrusel {
            display: flex; gap: 20px; overflow-x: auto; padding: 10px;
        }
        .carrusel::-webkit-scrollbar { display: none; }

        .card-canal {
            min-width: 250px; height: 140px; background: var(--glass);
            border-radius: 15px; display: flex; align-items: center; justify-content: center;
            border: 2px solid transparent; transition: 0.3s;
        }

        /* ESTADO DE FOCO */
        .card-canal:focus {
            transform: scale(1.1); border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0, 255, 157, 0.3); outline: none;
        }

        /* DOCK DE APPS INFERIOR */
        #dock-apps {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; background: var(--glass);
            padding: 15px 40px; border-radius: 50px; backdrop-filter: blur(20px);
        }

        .app-icon {
            width: 50px; height: 50px; border-radius: 10px;
            background: #222; display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        .app-icon:focus { transform: scale(1.2); border: 2px solid white; outline: none; }
    </style>
</head>
<body>

    <div class="top-section">
        <div id="contenedor-reproductor">
            <video id="reproductor-tv" class="video-js" controls></video>
        </div>
        <div class="panel-info">
            <h1>Canal 5 (Oficial)</h1>
            <p>EN VIVO: Honduras vs. Costa Rica</p>
            <small>Transmisión en directo desde el estadio...</small>
        </div>
    </div>

    <div class="fila-seccion">
        <div class="titulo-seccion">Canales</div>
        <div class="carrusel" id="lista-canales">
            <!-- Tarjetas de Canales -->
            <div class="card-canal" tabindex="0">Deportes TVC</div>
            <div class="card-canal" tabindex="0">Canal 5</div>
            <div class="card-canal" tabindex="0">Telecadena</div>
        </div>
    </div>

    <div id="dock-apps">
        <div class="app-icon" tabindex="0">YT</div>
        <div class="app-icon" tabindex="0">NF</div>
        <div class="app-icon" tabindex="0">PV</div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        videojs('reproductor-tv', { fluid: true });
        
        // Navegación inteligente
        document.addEventListener('keydown', (e) => {
            const allFocusable = document.querySelectorAll('[tabindex="0"]');
            let index = Array.from(allFocusable).indexOf(document.activeElement);
            
            if(e.key === 'ArrowRight' && index < allFocusable.length - 1) allFocusable[index + 1].focus();
            if(e.key === 'ArrowLeft' && index > 0) allFocusable[index - 1].focus();
        });
    </script>
</body>
</html>
