<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NextGen TV OS</title>
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    <style>
        :root {
            --accent: #6366f1;
            --bg: #050505;
            --card: rgba(255,255,255,0.05);
            --focus: rgba(99, 102, 241, 0.8);
        }

        body { 
            background: var(--bg); color: white; font-family: 'Inter', system-ui, sans-serif;
            margin: 0; padding: 40px; overflow-x: hidden;
        }

        /* Reproductor con diseño de cine */
        #contenedor-reproductor {
            width: 100%; height: 50vh; border-radius: 30px;
            overflow: hidden; border: 4px solid #1a1a1a;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-bottom: 40px;
        }

        /* Sistema de Filas para TV */
        .fila-seccion { margin-bottom: 50px; }
        .titulo-fila { font-size: 24px; font-weight: 700; margin-bottom: 20px; padding-left: 10px; }
        
        .carrusel {
            display: flex; gap: 20px; overflow-x: auto;
            padding: 20px 10px; scroll-behavior: smooth;
        }
        .carrusel::-webkit-scrollbar { display: none; }

        /* Tarjetas estilo App */
        .card-canal {
            min-width: 280px; height: 160px;
            background: var(--card); border-radius: 20px;
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 20px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 2px solid transparent;
        }

        .card-canal:focus {
            transform: scale(1.1); border-color: var(--accent);
            box-shadow: 0 0 30px var(--focus); outline: none;
            background: rgba(99, 102, 241, 0.2);
        }

        .card-canal h3 { margin: 0; font-size: 18px; }
        .card-canal p { margin: 5px 0 0; opacity: 0.7; font-size: 12px; }

        /* Dock flotante minimalista */
        #dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            padding: 15px 30px; border-radius: 50px; display: flex; gap: 20px;
        }
    </style>
</head>
<body>

    <div id="contenedor-reproductor">
        <video id="reproductor-tv" class="video-js vjs-big-play-centered" controls></video>
    </div>

    <div class="fila-seccion">
        <div class="titulo-fila">Canales Nacionales</div>
        <div class="carrusel" id="lista-canales">
            <!-- Los canales se inyectarán aquí -->
        </div>
    </div>

    <div id="dock">
        <div class="app-icono">📺 LIVE</div>
        <div class="app-icono">🎞️ VOD</div>
        <div class="app-icono">⚙️ AJUSTES</div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.js"></script>
    <script>
        const player = videojs('reproductor-tv', { fluid: true });
        
        // Lógica de navegación con teclado/control remoto
        document.addEventListener('keydown', (e) => {
            const focusable = document.querySelectorAll('.card-canal');
            let index = Array.from(focusable).indexOf(document.activeElement);

            if(e.key === 'ArrowRight' && index < focusable.length -1) focusable[index + 1].focus();
            if(e.key === 'ArrowLeft' && index > 0) focusable[index - 1].focus();
        });

        // Simulación de carga (puedes integrar tu fetch aquí)
        const lista = document.getElementById('lista-canales');
        for(let i=0; i<10; i++) {
            const card = document.createElement('div');
            card.className = 'card-canal';
            card.tabIndex = 0;
            card.innerHTML = `<h3>Canal ${i+1}</h3><p>Señal HD Estable</p>`;
            card.onclick = () => alert('Reproduciendo...');
            lista.appendChild(card);
        }
    </script>
</body>
</html>
