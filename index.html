<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gaming Dashboard J7</title>
    <style>
        /* Estilos base futuristas */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #050508; color: #00ffcc; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Contenedor principal con efecto Neón RGB animado */
        .dashboard {
            width: 95vw; height: 90vh; background: rgba(10, 10, 15, 0.9);
            border: 3px solid #ff0055; border-radius: 15px;
            box-shadow: 0 0 20px #ff0055, inset 0 0 15px rgba(255, 0, 85, 0.3);
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 20px; padding: 20px;
            animation: neonGlow 4s infinite alternate;
        }

        /* Bloques individuales del panel */
        .widget {
            background: rgba(20, 20, 30, 0.6); border: 1px solid #00ffcc; border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.2);
            display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px;
        }
        
        .widget-title { font-size: 14px; text-transform: uppercase; color: #ffbf00; letter-spacing: 2px; margin-bottom: 5px; }
        .huge-text { font-size: 50px; font-weight: bold; text-shadow: 0 0 10px #00ffcc; color: #00ffcc; }
        .data-text { font-size: 32px; color: #00ffcc; font-weight: bold; }

        /* Animación de luces neón */
        @keyframes neonGlow {
            0% { border-color: #ff0055; box-shadow: 0 0 15px #ff0055; }
            50% { border-color: #00ffcc; box-shadow: 0 0 15px #00ffcc; }
            100% { border-color: #ffbf00; box-shadow: 0 0 15px #ffbf00; }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- BLOQUE 1: RELOJ EN TIEMPO REAL -->
        <div class="widget">
            <div class="widget-title">🕒 TIME SYSTEM</div>
            <div id="clock" class="huge-text">00:00:00</div>
        </div>

        <!-- BLOQUE 2: CLIMA / TIEMPO -->
        <div class="widget">
            <div class="widget-title">🌍 WEATHER CORPS</div>
            <!-- Puedes reemplazar este texto por un Widget HTML real de páginas como ElTiempo.es -->
            <div class="data-text" id="weather">24°C / DESPEJADO</div>
        </div>

        <!-- BLOQUE 3: TEMPERATURA HABITACIÓN -->
        <div class="widget">
            <div class="widget-title">🔥 ROOM CORE TEMP</div>
            <div class="data-text" style="color: #ff0055;">21.5 °C</div>
        </div>

        <!-- BLOQUE 4: HUMEDAD O ESTADO -->
        <div class="widget">
            <div class="widget-title">💧 AIR HUMIDITY</div>
            <div class="data-text" style="color: #ffbf00;">45 %</div>
        </div>
    </div>

    <script>
        // Función para actualizar el reloj cada segundo
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
